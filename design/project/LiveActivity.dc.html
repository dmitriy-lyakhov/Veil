<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Veil Live Activity</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&family=Arimo:wght@400;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
button{font-family:inherit}
@keyframes vRise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){*{animation-duration:.001s !important;transition-duration:.001s !important}}
</style>
</helmet>
<div style="width:460px;height:640px;position:relative;background:#01040F;border-radius:28px;overflow:hidden;font-family:Montserrat,system-ui,sans-serif;color:#fff">

<div style="{{islandStyle}}">
<sc-if value="{{isCompact}}" hint-placeholder-val="{{false}}">
<div style="width:100%;height:100%;display:flex;align-items:center;justify-content:space-between;padding:0 14px;box-sizing:border-box;animation:vRise .3s .1s both">
<svg width="20" height="20" viewBox="0 0 32 32" aria-hidden="true"><path d="M3 4h8l9 23h-8z" fill="#FF393D"></path><path d="M29 4h-8l-9 23h8z" fill="#6B6F78"></path><path d="M16 16.8L12 27h8z" fill="#D9DBE0"></path></svg>
<span style="font-family:Arimo,Arial,sans-serif;font-size:14px;font-weight:700;font-variant-numeric:tabular-nums;color:#7DE0A0">{{timerShort}}</span>
</div>
</sc-if>
<sc-if value="{{isMin}}" hint-placeholder-val="{{false}}">
<div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;animation:vRise .3s .1s both">
<svg width="18" height="18" viewBox="0 0 32 32" aria-hidden="true"><path d="M3 4h8l9 23h-8z" fill="#FF393D"></path><path d="M29 4h-8l-9 23h8z" fill="#6B6F78"></path><path d="M16 16.8L12 27h8z" fill="#D9DBE0"></path></svg>
</div>
</sc-if>
<sc-if value="{{isExp}}" hint-placeholder-val="{{false}}">
<div style="width:100%;height:100%;box-sizing:border-box;padding:22px 24px;display:flex;flex-direction:column;justify-content:space-between;animation:vRise .35s .15s both">
<div style="display:flex;align-items:center;justify-content:space-between;gap:8px">
<div style="display:flex;align-items:center;gap:8px;font-size:15px;font-weight:600;white-space:nowrap"><svg width="24" height="24" viewBox="0 0 32 32" aria-hidden="true"><path d="M3 4h8l9 23h-8z" fill="#FF393D"></path><path d="M29 4h-8l-9 23h8z" fill="#6B6F78"></path><path d="M16 16.8L12 27h8z" fill="#D9DBE0"></path></svg>Veil · {{t.server}}</div>
<div style="display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:#A8AAB2;white-space:nowrap"><span style="width:8px;height:8px;border-radius:50%;background:#7DE0A0"></span>{{t.protected}}</div>
</div>
<div style="font-family:Arimo,Arial,sans-serif;font-size:38px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1">{{timer}}</div>
<div style="display:flex;align-items:center;justify-content:space-between;gap:8px">
<div style="font-family:Arimo,Arial,sans-serif;font-size:13px;display:flex;gap:14px;white-space:nowrap"><span><span style="color:#7DE0A0">▼</span> {{dl}} {{t.mbs}}</span><span><span style="color:#7DE0A0">▲</span> {{ul}} {{t.mbs}}</span></div>
<button type="button" style="min-height:44px;padding:0 20px;border:0;border-radius:22px;background:#FF393D;color:#0B0B0C;font-size:14px;font-weight:600;cursor:pointer;white-space:nowrap">{{t.disconnect}}</button>
</div>
</div>
</sc-if>
</div>

<div style="position:absolute;left:24px;right:24px;top:236px;bottom:24px;display:flex;flex-direction:column;gap:24px">
<div style="display:flex;flex-direction:column;gap:10px">
<div style="font-size:12px;font-weight:500;color:#A8AAB2">Dynamic Island</div>
<div role="group" aria-label="Dynamic Island" style="display:flex;gap:8px;flex-wrap:wrap">
<sc-for list="{{modes}}" as="m" hint-placeholder-count="4">
<button type="button" onClick="{{m.go}}" style="{{m.style}}">{{m.label}}</button>
</sc-for>
</div>
</div>

<div style="display:flex;flex-direction:column;gap:10px">
<div style="font-size:12px;font-weight:500;color:#A8AAB2">{{t.lock}}</div>
<div style="background:#1B1C1F;border-radius:16px;padding:16px 18px;display:flex;flex-direction:column;gap:14px">
<div style="display:flex;align-items:center;justify-content:space-between;gap:8px">
<div style="display:flex;align-items:center;gap:10px"><svg width="28" height="28" viewBox="0 0 32 32" aria-hidden="true"><path d="M3 4h8l9 23h-8z" fill="#FF393D"></path><path d="M29 4h-8l-9 23h8z" fill="#6B6F78"></path><path d="M16 16.8L12 27h8z" fill="#D9DBE0"></path></svg>
<div style="display:flex;flex-direction:column;gap:2px"><span style="font-size:15px;font-weight:600">{{t.protected}}</span><span style="font-size:12px;font-weight:500;color:#A8AAB2">{{t.server}} · AmneziaWG</span></div></div>
<span style="font-family:Arimo,Arial,sans-serif;font-size:22px;font-weight:700;font-variant-numeric:tabular-nums">{{timer}}</span>
</div>
<div style="display:flex;align-items:center;justify-content:space-between;gap:8px">
<div style="font-family:Arimo,Arial,sans-serif;font-size:13px;display:flex;gap:14px;white-space:nowrap"><span><span style="color:#7DE0A0">▼</span> {{dl}} {{t.mbs}}</span><span><span style="color:#7DE0A0">▲</span> {{ul}} {{t.mbs}}</span></div>
<button type="button" style="min-height:44px;padding:0 18px;border:0;border-radius:14px;background:#2A2B30;color:#fff;font-size:14px;font-weight:600;cursor:pointer;white-space:nowrap">{{t.disconnect}}</button>
</div>
</div>
<p style="margin:6px 0 0;font-size:12px;font-weight:500;color:#A8AAB2;line-height:1.5">{{t.note}}</p>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"lang":{"editor":"enum","options":["ru","en"],"default":"ru"},"$preview":{"width":460,"height":640}}'>
class Component extends DCLogic {
  state = { mode: 'exp', s: 768 };
  componentDidMount() { this._iv = setInterval(() => this.setState({ s: this.state.s + 1 }), 1000); }
  componentWillUnmount() { clearInterval(this._iv); }
  renderVals() {
    const ru = (this.props.lang ?? 'ru') === 'ru';
    const L = (en, r) => (ru ? r : en);
    const m = this.state.mode, s = this.state.s;
    const p2 = (n) => String(n).padStart(2, '0');
    const timer = `${p2(Math.floor(s / 3600))}:${p2(Math.floor(s / 60) % 60)}:${p2(s % 60)}`;
    const timerShort = `${p2(Math.floor(s / 60) % 60)}:${p2(s % 60)}`;
    const dl = (8 + 6 * Math.abs(Math.sin(s * 0.9))).toFixed(1);
    const ul = (1.5 + 1.2 * Math.abs(Math.sin(s * 1.7))).toFixed(1);
    const dims = { idle: [126, 37, 19], min: [37, 37, 19], comp: [210, 37, 19], exp: [412, 176, 40] }[m];
    const islandStyle = `position:absolute;left:50%;top:14px;margin-left:${-dims[0] / 2}px;width:${dims[0]}px;height:${dims[1]}px;border-radius:${dims[2]}px;background:#000000;overflow:hidden;transition:width .5s cubic-bezier(.34,1.3,.64,1),height .5s cubic-bezier(.34,1.3,.64,1),margin .5s cubic-bezier(.34,1.3,.64,1),border-radius .5s cubic-bezier(.2,0,.2,1)`;
    const defs = [['idle', L('Idle', 'Покой')], ['min', L('Minimal', 'Минимальный')], ['comp', L('Compact', 'Компактный')], ['exp', L('Expanded', 'Развёрнутый')]];
    const modes = defs.map(([id, label]) => ({
      label, go: () => this.setState({ mode: id }),
      style: `min-height:44px;padding:0 18px;border:0;border-radius:14px;font-size:14px;font-weight:600;cursor:pointer;background:${m === id ? '#FF393D' : '#1B1C1F'};color:${m === id ? '#0B0B0C' : '#FFFFFF'};transition:background .2s ease`
    }));
    const t = {
      server: L('Server 1', 'Сервер 1'), protected: L('Protected', 'Защищено'), mbs: L('MB/s', 'МБ/с'), disconnect: L('Disconnect', 'Отключить'),
      lock: L('Lock screen · Live Activity', 'Экран блокировки · Live Activity'),
      note: L('Timer and speed update through ActivityKit. Disconnect is an App Intent: the app does not open.', 'Таймер и скорость обновляются через ActivityKit. «Отключить» — App Intent: приложение не открывается.')
    };
    return { islandStyle, modes, timer, timerShort, dl, ul, t, isCompact: m === 'comp', isMin: m === 'min', isExp: m === 'exp' };
  }
}
</script>
</body>
</html>
