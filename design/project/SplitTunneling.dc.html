<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Veil split tunneling</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600&display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div style="width:1772px;height:880px;box-sizing:border-box;padding:40px;background:#E4E6EA;display:flex;gap:40px;font-family:Montserrat,system-ui,sans-serif;color:#0B0B0C">
<sc-for list="{{cells}}" as="p" hint-placeholder-count="4">
<div style="width:393px;flex:none;display:flex;flex-direction:column;gap:12px">
<div style="font-size:14px;font-weight:600;height:20px">{{p.cap}}</div>
<div style="width:393px;height:760px;border-radius:28px;overflow:hidden">
<dc-import name="App" theme="{{p.theme}}" lang="{{p.lang}}" platform="{{p.platform}}" layout="compact" start="{{p.start}}" sheet="{{p.sheet}}" w="393" h="760" safe-top="12" safe-bottom="12" hint-size="393px,760px"></dc-import>
</div>
</div>
</sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1772,"height":880}}'>
class Component extends DCLogic {
  renderVals() {
    return { cells: [
      { cap: '1 · Выбор режима', theme: 'dark', lang: 'ru', platform: 'android', start: 'home', sheet: 'split' },
      { cap: '2 · По сайтам (Android)', theme: 'dark', lang: 'ru', platform: 'android', start: 'splitSites', sheet: 'none' },
      { cap: '3 · По приложениям (Android, оба режима)', theme: 'light', lang: 'ru', platform: 'android', start: 'splitApps', sheet: 'none' },
      { cap: '4 · iOS: по приложениям недоступно', theme: 'light', lang: 'en', platform: 'ios', start: 'splitApps', sheet: 'none' }
    ] };
  }
}
</script>
</body>
</html>
