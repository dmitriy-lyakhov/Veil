<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Veil all screens on iPhone Duo</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&family=Arimo:wght@400;700&display=swap" rel="stylesheet">
<style>body{margin:0}button{font-family:inherit}button:focus-visible{outline:2px solid #FF393D;outline-offset:2px}</style>
</helmet>
<div style="width:1860px;height:1220px;overflow:hidden;box-sizing:border-box;padding:40px;background:{{c.ground}};color:{{c.ink}};font-family:Montserrat,system-ui,sans-serif;display:flex;gap:32px">

<sc-if value="{{it.isItem}}" hint-placeholder-val="{{true}}"><button type="button" onClick="{{it.go}}" style="{{it.style}}">{{it.label}}</button></sc-if>
</sc-for>
</div>
<div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:14px">
<div style="display:flex;align-items:baseline;gap:12px"><h1 style="margin:0;font-size:24px;font-weight:600">Все экраны · iPhone Duo</h1><span style="font-size:14px;font-weight:600;color:{{c.ink2}}">{{caption}}</span></div>

<div style="display:flex;gap:28px;align-items:flex-start">
<div style="display:flex;flex-direction:column;gap:8px"><span style="font-size:12px;font-weight:600;color:{{c.ink2}}">Внешний экран · сложен</span>
<div style="width:376px;height:796px;box-sizing:border-box;padding:8px;background:#01040F;border-radius:52px;flex:none"><div style="position:relative;width:360px;height:780px;border-radius:44px;overflow:hidden"><dc-import name="App" theme="{{theme}}" lang="{{lang}}" platform="ios" layout="compact" w="360" h="780" safe-top="48" safe-bottom="28" screen="{{scr.screen}}" conn="{{scr.conn}}" server="{{scr.server}}" mgr="{{scr.mgr}}" ssh="{{scr.ssh}}" tabsel="{{scr.tabsel}}" step="{{scr.step}}" sheet="none" hint-size="360px,780px"></dc-import><div style="position:absolute;left:50%;top:16px;margin-left:-8px;width:16px;height:16px;border-radius:50%;background:#01040F" aria-hidden="true"></div></div></div></div>
<div style="display:flex;flex-direction:column;gap:8px"><span style="font-size:12px;font-weight:600;color:{{c.ink2}}">Внутренний экран · {{modeName}}</span>
<sc-if value="{{isBook}}" hint-placeholder-val="{{true}}">
<div style="width:876px;height:656px;box-sizing:border-box;padding:8px;background:#01040F;border-radius:38px;flex:none"><div style="position:relative;width:860px;height:640px;border-radius:30px;overflow:hidden"><dc-import name="App" theme="{{theme}}" lang="{{lang}}" platform="ios" layout="rail" hinge="vertical" w="860" h="640" safe-top="0" safe-bottom="0" screen="{{scr.screen}}" conn="{{scr.conn}}" server="{{scr.server}}" mgr="{{scr.mgr}}" ssh="{{scr.ssh}}" tabsel="{{scr.tabsel}}" step="{{scr.step}}" sheet="none" hint-size="860px,640px"></dc-import><div style="position:absolute;left:421px;top:0;width:18px;height:640px;pointer-events:none;display:flex;justify-content:space-between" aria-hidden="true"><span style="width:1px;height:100%;background:#01040F;opacity:.35"></span><span style="width:6px;height:100%;background:#01040F;opacity:.28"></span><span style="width:1px;height:100%;background:#01040F;opacity:.35"></span></div></div></div>
</sc-if>
<sc-if value="{{isSplit}}" hint-placeholder-val="{{false}}">
<div style="width:876px;height:656px;box-sizing:border-box;padding:8px;background:#01040F;border-radius:38px;flex:none"><div style="position:relative;width:860px;height:640px;border-radius:30px;overflow:hidden"><div style="display:flex;gap:6px;background:#01040F;width:860px;height:640px"><div style="width:427px;height:640px;overflow:hidden"><dc-import name="App" theme="{{theme}}" lang="{{lang}}" platform="ios" layout="compact" w="427" h="640" safe-top="0" safe-bottom="8" screen="{{scr.screen}}" conn="{{scr.conn}}" server="{{scr.server}}" mgr="{{scr.mgr}}" ssh="{{scr.ssh}}" tabsel="{{scr.tabsel}}" step="{{scr.step}}" sheet="none" hint-size="427px,640px"></dc-import></div><div style="width:427px;height:640px;overflow:hidden"><dc-import name="App" theme="{{theme}}" lang="{{lang}}" platform="ios" layout="compact" w="427" h="640" safe-top="0" safe-bottom="8" hint-size="427px,640px"></dc-import></div></div></div></div>
</sc-if>
</div>
</div>
</div>
</div>
</x-dc>

  }

</script>
</body>
</html>
