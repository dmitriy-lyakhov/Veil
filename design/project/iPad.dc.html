<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Veil for iPadOS</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>body{margin:0}</style>
</helmet>
<div style="width:1200px;height:840px;box-sizing:border-box;padding:10px;background:#01040F;border-radius:38px">
<div style="position:relative;width:1180px;height:820px;border-radius:28px;overflow:hidden">
<dc-import name="App" theme="{{theme}}" lang="{{lang}}" platform="ipados" layout="wide" w="1180" h="820" safe-top="24" safe-bottom="20" hint-size="1180px,820px"></dc-import>
<div style="position:absolute;left:50%;margin-left:-70px;bottom:8px;width:140px;height:5px;border-radius:3px;background:{{c.ink}};pointer-events:none" aria-hidden="true"></div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"lang":{"editor":"enum","options":["ru","en"],"default":"ru"},"$preview":{"width":1200,"height":840}}'>
class Component extends DCLogic {
  renderVals() { const th = this.props.theme ?? 'dark'; const lt = th === 'light'; return { theme: th, lang: this.props.lang ?? 'ru', c: { bg: lt ? '#FFFFFF' : '#0B0B0C', bar: lt ? '#F2F3F5' : '#1B1C1F', ink: lt ? '#0B0B0C' : '#FFFFFF', ctl: lt ? '#E4E6EA' : '#2A2B30', ground: lt ? '#E4E6EA' : '#0B0B0C' } }; }
}
</script>
</body>
</html>
