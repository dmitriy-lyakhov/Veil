# Основной репозиторий — GitLab (monitoring/veil). В GitHub изменения попадают только отсюда, через этот пайплайн.
#
# Нужна переменная GITHUB_TOKEN (Settings → CI/CD → Variables, лучше masked и protected): токен с правом
# записи в репозиторий GitHub (classic: scope `repo`; fine-grained: Contents → Read and write).
# Необязательная переменная GITHUB_REPO — «владелец/репозиторий», по умолчанию dmitriy-lyakhov/Veil.
#
# Если в GitHub появились коммиты, которых нет в GitLab, отправка завершится ошибкой (принудительно не затираем):
# перенесите их в GitLab и запустите пайплайн заново.

stages:
  - mirror
  - release

variables:
  GIT_DEPTH: "0"          # полная история, иначе отправка в GitHub сломается
  GIT_STRATEGY: clone
  GITHUB_REPO: "dmitriy-lyakhov/Veil"

mirror-to-github:
  stage: mirror
  image:
    name: alpine/git:latest
    entrypoint: [""]
  resource_group: github-mirror   # не больше одной отправки одновременно
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_TAG'
  script:
    - test -n "$GITHUB_TOKEN" || { echo "Не задана переменная GITHUB_TOKEN"; exit 1; }
    # токен передаётся заголовком, а не в адресе: так он не попадает в вывод и в .git/config
    - AUTH="$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 | tr -d '\n')"
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        git -c "http.extraHeader=Authorization: Basic ${AUTH}" push "https://github.com/${GITHUB_REPO}.git" "refs/tags/${CI_COMMIT_TAG}:refs/tags/${CI_COMMIT_TAG}"
      else
        git -c "http.extraHeader=Authorization: Basic ${AUTH}" push "https://github.com/${GITHUB_REPO}.git" "${CI_COMMIT_SHA}:refs/heads/${CI_DEFAULT_BRANCH}"
      fi

# Релиз в GitHub по тегу vX.Y.Z: файлы берутся из пакетного реестра GitLab (generic-пакет veil/X.Y.Z, их туда
# загружают при выпуске версии), описание — из сообщения аннотированного тега. Из этого релиза приложения
# (Windows и Android) скачивают обновления, поэтому SHA256SUMS.txt обязателен. Повторный запуск задания
# дозаливает файлы: одноимённые файлы в релизе заменяются.
github-release:
  stage: release
  image: alpine:3.20
  needs: ["mirror-to-github"]
  resource_group: github-mirror
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/'
  script:
    - test -n "$GITHUB_TOKEN" || { echo "Не задана переменная GITHUB_TOKEN"; exit 1; }
    - apk add --no-cache curl jq git >/dev/null
    - V="${CI_COMMIT_TAG#v}"
    - FILES="Veil-${V}-windows-setup.exe Veil-${V}-windows-portable.zip Veil-${V}-android.apk veil-server-${V}-linux-amd64 veil-server-${V}-linux-arm64 SHA256SUMS.txt"
    - mkdir -p out
    - |
      for f in $FILES; do
        curl -fsSL --retry 3 -H "JOB-TOKEN: ${CI_JOB_TOKEN}" -o "out/$f" \
          "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/veil/${V}/$f" || { echo "нет файла $f в пакете veil/${V}"; exit 1; }
      done
    - (cd out && sha256sum -c SHA256SUMS.txt)
    - git tag -l --format='%(contents)' "$CI_COMMIT_TAG" > notes.md
    - GH="https://api.github.com/repos/${GITHUB_REPO}"
    - 'HDR="Authorization: Bearer ${GITHUB_TOKEN}"'
    - |
      ID=$(curl -fsS -H "$HDR" "$GH/releases/tags/$CI_COMMIT_TAG" 2>/dev/null | jq -r '.id // empty' || true)
      if [ -z "$ID" ]; then
        jq -n --arg t "$CI_COMMIT_TAG" --arg n "Veil $V" --rawfile b notes.md '{tag_name:$t, name:$n, body:$b}' > rel.json
        ID=$(curl -fsS -X POST -H "$HDR" -H "Content-Type: application/json" --data @rel.json "$GH/releases" | jq -r .id)
      fi
      test -n "$ID" && test "$ID" != null
      for f in $FILES; do
        OLD=$(curl -fsS -H "$HDR" "$GH/releases/$ID/assets?per_page=100" | jq -r --arg n "$f" '.[] | select(.name==$n) | .id')
        [ -n "$OLD" ] && curl -fsS -X DELETE -H "$HDR" "$GH/releases/assets/$OLD"
        curl -fsS -X POST -H "$HDR" -H "Content-Type: application/octet-stream" --data-binary "@out/$f" \
          "https://uploads.github.com/repos/${GITHUB_REPO}/releases/$ID/assets?name=$f" > /dev/null
        echo "загружен $f"
      done
