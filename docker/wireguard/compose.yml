# WireGuard (интерфейс veilwg, UDP 51820, подсеть 10.8.1.0/24 + ULA /64).
# Отдельно:  docker compose -f docker/wireguard/compose.yml up -d --build
# Клиенты:   docker compose exec wireguard client add phone | list | show NAME | remove NAME

name: veil-wireguard

services:
  wireguard:
    container_name: veil-wireguard
    labels:
      net.veil.protocol: wireguard
    build:
      context: ../..
      dockerfile: docker/wireguard/Dockerfile
      args:
        # source — собрать Go-бинарники из исходников; prebuilt — взять готовые из bin/ (так делает приложение)
        BIN_FROM: ${VEIL_BIN_FROM:-source}
    image: ${VEIL_IMAGE_REGISTRY:-veil}/wireguard:${VEIL_IMAGE_TAG:-latest}
    restart: unless-stopped
    cap_add: [NET_ADMIN]
    devices: ["/dev/net/tun:/dev/net/tun"]
    sysctls:
      net.ipv4.ip_forward: 1
      net.ipv4.conf.all.src_valid_mark: 1
      net.ipv6.conf.all.disable_ipv6: 0
      net.ipv6.conf.default.disable_ipv6: 0
      net.ipv6.conf.all.forwarding: 1
    environment:
      VEIL_HOST: ${VEIL_HOST:-}          # адрес сервера в конфигах клиентов; пусто — определить автоматически
      VEIL_DETECT_IP: ${VEIL_DETECT_IP:-1}
      WG_PORT: ${WG_PORT:-51820}
      WG_PUBLIC_PORT: ${WG_PORT:-51820}
      WG_SUBNET: ${WG_SUBNET:-10.8.1.0/24}
      WG_FIRST_CLIENT: ${WG_FIRST_CLIENT-client}
    ports:
      - "${WG_PORT:-51820}:${WG_PORT:-51820}/udp"
    volumes:
      - wireguard-data:/etc/wireguard
    networks:
      - wireguard
    healthcheck:
      test: ["CMD", "wg", "show", "veilwg", "listen-port"]
      interval: 30s
      timeout: 5s
      start_period: 15s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

networks:
  wireguard:
    enable_ipv6: true
    driver_opts:
      # MTU внешнего интерфейса сервера (облака часто дают 1450–1460); приложение выставляет его само
      com.docker.network.driver.mtu: ${VEIL_DOCKER_MTU:-1500}
    ipam:
      config:
        - subnet: ${WG_NET_IPV6:-fd76:6569:6c00:2::/64}

volumes:
  wireguard-data:
